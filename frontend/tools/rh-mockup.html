<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBG · Robinhood-style direction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:#e9ebef; padding:28px; -webkit-font-smoothing:antialiased; }
  .wrap { display:flex; gap:24px; justify-content:center; align-items:flex-start; max-width:1180px; margin:0 auto; }
  .panel { flex:1; max-width:540px; border-radius:22px; overflow:hidden; transition:transform .25s cubic-bezier(.2,.7,.2,1); }

  /* ---- THEME TOKENS ---- */
  .light { --bg:#f6f7f9; --card:#ffffff; --elev:#ffffff; --line:#eef0f3; --line2:#e4e7ec;
           --tx:#0c0e14; --mut:#727a86; --faint:#9aa1ad; --accent:#e1352c; --accentSoft:#fdecea;
           --pos:#11936a; --posSoft:#e5f4ee; --warn:#b9770a; --warnSoft:#fbf0db; --neg:#d23b34; --negSoft:#fcebea;
           --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 22px rgba(16,24,40,.06); }
  .dark  { --bg:#0b0c0f; --card:#15171d; --elev:#1b1e26; --line:#23262f; --line2:#2c303a;
           --tx:#f4f6f9; --mut:#9aa1ae; --faint:#6b727f; --accent:#ff5b4f; --accentSoft:#2a1916;
           --pos:#26d08a; --posSoft:#10241d; --warn:#ffb627; --warnSoft:#2a2210; --neg:#ff5d52; --negSoft:#2a1614;
           --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px rgba(0,0,0,.45); }

  .panel { background:var(--bg); color:var(--tx); box-shadow:var(--shadow); }

  /* top bar */
  .top { display:flex; align-items:center; gap:12px; padding:18px 22px 8px; }
  .logo { width:30px; height:30px; border-radius:9px; background:var(--accent); color:#fff; font-weight:800; font-size:15px;
          display:flex; align-items:center; justify-content:center; letter-spacing:-.5px; }
  .top .hi { font-size:15px; font-weight:700; }
  .top .date { font-size:12.5px; color:var(--mut); font-weight:500; }
  .top .spacer { flex:1; }
  .iconbtn { width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--line2);
             display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:15px; }
  .me { width:34px; height:34px; border-radius:50%; background:#6b4ce6; color:#fff; font-weight:600; font-size:13px;
        display:flex; align-items:center; justify-content:center; }

  .body { padding:8px 22px 24px; }
  .seclabel { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:22px 4px 11px; }

  /* hero countdown */
  .hero { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px 22px; }
  .hero .row1 { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .hero .dot { width:7px; height:7px; border-radius:50%; background:var(--neg); }
  .hero .lbl { font-size:12.5px; color:var(--mut); font-weight:600; }
  .hero .pname { font-size:17px; font-weight:700; margin:6px 0 14px; letter-spacing:-.2px; }
  .hero .big { font-size:46px; font-weight:800; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; line-height:1; }
  .hero .big small { font-size:18px; font-weight:700; color:var(--mut); margin-left:2px; }
  .hero .sub { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
  .hero .due { font-size:12.5px; color:var(--mut); font-weight:500; }
  .bar { height:6px; border-radius:99px; background:var(--line2); width:120px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:75%; background:var(--pos); border-radius:99px; }

  /* stat cards */
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .stat .v { font-size:25px; font-weight:800; letter-spacing:-.6px; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:12px; color:var(--mut); font-weight:600; margin-top:2px; }
  .stat .v.neg { color:var(--neg); } .stat .v.warn { color:var(--warn); }

  /* task list */
  .list { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .item { display:flex; align-items:center; gap:13px; padding:14px 16px; border-bottom:1px solid var(--line);
          transition:background .15s ease; }
  .item:last-child { border-bottom:0; }
  .sdot { width:9px; height:9px; border-radius:50%; flex:none; }
  .sdot.neg{background:var(--neg);} .sdot.warn{background:var(--warn);} .sdot.pos{background:var(--pos);} .sdot.prog{background:#3b82f6;}
  .it-main { flex:1; min-width:0; }
  .it-t { font-size:14px; font-weight:600; letter-spacing:-.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .it-m { font-size:12px; color:var(--mut); font-weight:500; margin-top:2px; }
  .av { width:26px; height:26px; border-radius:50%; color:#fff; font-size:11px; font-weight:600;
        display:flex; align-items:center; justify-content:center; flex:none; }
  .when { font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; min-width:62px; text-align:right; }
  .when.neg{color:var(--neg);} .when.warn{color:var(--warn);} .when.mut{color:var(--mut);}
  .pill { font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; }
  .pill.neg{background:var(--negSoft); color:var(--neg);} .pill.warn{background:var(--warnSoft); color:var(--warn);}

  .caption { text-align:center; font-size:12px; color:#8b929d; margin-top:16px; font-weight:600; letter-spacing:.02em; }
</style></head>
<body>
<div class="wrap">

  <!-- ============ build both panels from one template via JS ============ -->
  <div class="panel light" id="p-light"></div>
  <div class="panel dark"  id="p-dark"></div>

</div>
<div class="caption">SBG “Today” — same screen, light & dark · Robinhood-style direction (mockup, not the live app)</div>

<script>
  const tpl = (mode) => `
    <div class="top">
      <div class="logo">S</div>
      <div>
        <div class="hi">Good morning, Trent</div>
        <div class="date">Monday, June 15</div>
      </div>
      <div class="spacer"></div>
      <div class="iconbtn">⌕</div>
      <div class="me">TH</div>
    </div>
    <div class="body">

      <div class="seclabel">Next bid due</div>
      <div class="hero">
        <div class="row1"><span class="dot"></span><span class="lbl">Currently bidding</span></div>
        <div class="pname">Lincoln Elementary — Addition</div>
        <div class="big">2<small>d</small> 14<small>h</small> 32<small>m</small></div>
        <div class="sub">
          <span class="due">Due Wed Jun 17 · 2:00 PM</span>
          <span style="display:flex;align-items:center;gap:8px">
            <span class="due">18/24 tasks</span><span class="bar"><i></i></span>
          </span>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="v">7</div><div class="k">Active projects</div></div>
        <div class="stat"><div class="v warn">5</div><div class="k">Due today</div></div>
        <div class="stat"><div class="v neg">3</div><div class="k">Overdue</div></div>
        <div class="stat"><div class="v">142<span style="font-size:15px;color:var(--mut)">h</span></div><div class="k">Team hours</div></div>
      </div>

      <div class="seclabel">Needs attention</div>
      <div class="list">
        <div class="item">
          <span class="sdot neg"></span>
          <div class="it-main"><div class="it-t">Send RFQ package to mechanical subs</div><div class="it-m">Trade Solicitation · Lincoln Elementary</div></div>
          <span class="when neg">−1d</span>
        </div>
        <div class="item">
          <span class="sdot warn"></span>
          <div class="it-main"><div class="it-t">Level concrete scope across subs</div><div class="it-m">Scope Leveling · Riverside Med</div></div>
          <div class="av" style="background:#0e9f6e">CB</div>
          <span class="when warn">5:00p</span>
        </div>
        <div class="item">
          <span class="sdot prog"></span>
          <div class="it-main"><div class="it-t">Build alternates & VE list</div><div class="it-m">Estimating · Lincoln Elementary</div></div>
          <div class="av" style="background:#7b4397">RM</div>
          <span class="when mut">Jun 18</span>
        </div>
        <div class="item">
          <span class="sdot pos"></span>
          <div class="it-main"><div class="it-t">Confirm bid bond & insurance</div><div class="it-m">Bid Day Prep · Glenwood Office</div></div>
          <div class="av" style="background:#2563a8">TH</div>
          <span class="when mut">Jun 20</span>
        </div>
      </div>

    </div>`;
  document.getElementById('p-light').innerHTML = tpl('light');
  document.getElementById('p-dark').innerHTML  = tpl('dark');
</script>
</body></html>
